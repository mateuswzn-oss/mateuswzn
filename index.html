<!doctype html>
<html lang="pt-BR" style="background:#020617;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<!-- O navegador pinta a canvas dele com o esquema de cores declarado
     antes de qualquer CSS valer — sem isso sobra um lampejo branco
     antes do primeiro quadro. Mesma técnica já usada no app real. -->
<meta name="color-scheme" content="dark">
<title>mateus workspace — em atualização</title>
<meta name="description" content="estamos preparando uma nova versão do mateus workspace. voltamos em breve.">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#020617;
    color:#eef2ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid;
    place-items:center;
    min-height:100dvh;
    padding:24px;
    overflow:hidden;
    position:relative;
  }
  /* Fundo azul-marinho com luz respirando ao fundo, a mesma linguagem
     visual da tela de carregamento do app — devagar e sutil, nunca
     chamando mais atenção que o texto. */
  .mnt-fundo{
    position:fixed;inset:-10%;z-index:0;pointer-events:none;
    background:
      radial-gradient(closest-side, rgba(76,120,255,.16), transparent 70%) 22% 28% / 55% 55% no-repeat,
      radial-gradient(closest-side, rgba(124,92,255,.14), transparent 70%) 80% 74% / 60% 60% no-repeat;
    animation:mntRespira 9s ease-in-out infinite;
  }
  @keyframes mntRespira{
    0%,100%{opacity:.7;transform:scale(1)}
    50%{opacity:1;transform:scale(1.06)}
  }
  .mnt-card{
    position:relative;z-index:1;
    width:min(440px,100%);
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;
  }
  .mnt-logo{
    width:76px;height:76px;border-radius:24px;
    display:grid;place-items:center;
    background:linear-gradient(150deg,#161b30 0%,#0a0c16 100%);
    border:1px solid rgba(148,163,255,.28);
    box-shadow:0 0 0 1px rgba(124,92,255,.16),0 0 32px rgba(76,120,255,.34),inset 0 1px 0 rgba(255,255,255,.10);
    animation:mntPulso 3.2s ease-in-out infinite;
  }
  @keyframes mntPulso{
    0%,100%{box-shadow:0 0 0 1px rgba(124,92,255,.16),0 0 32px rgba(76,120,255,.34),inset 0 1px 0 rgba(255,255,255,.10)}
    50%{box-shadow:0 0 0 1px rgba(124,92,255,.26),0 0 46px rgba(76,120,255,.5),inset 0 1px 0 rgba(255,255,255,.14)}
  }
  .mnt-logo span{
    font-size:26px;font-weight:800;letter-spacing:-.03em;color:#f3f6ff;
  }
  h1{
    margin:0;font-size:clamp(22px,4.5vw,30px);font-weight:800;letter-spacing:-.01em;color:#f5f7ff;
  }
  p{
    margin:0;font-size:15px;line-height:1.6;color:rgba(220,228,255,.72);max-width:38ch;
  }
  /* Sem text-transform: o pedido é que todo o texto fique em minúsculo,
     e o uppercase daqui desfaria isso na hora de renderizar. */
  .mnt-linha{
    display:flex;align-items:center;gap:8px;margin-top:4px;
    font-size:13px;font-weight:600;letter-spacing:.03em;
    color:rgba(148,197,255,.85);
  }
  .mnt-ponto{
    width:7px;height:7px;border-radius:50%;
    background:linear-gradient(135deg,#67e8f9,#7c5cff);
    animation:mntPisca 1.6s ease-in-out infinite;
  }
  @keyframes mntPisca{
    0%,100%{opacity:.35;transform:scale(.85)}
    50%{opacity:1;transform:scale(1.15)}
  }
  .mnt-marca{
    margin-top:18px;font-size:11.5px;color:rgba(220,228,255,.38);letter-spacing:.03em;
  }
  @media(prefers-reduced-motion:reduce){
    .mnt-fundo,.mnt-logo,.mnt-ponto{animation:none!important}
  }
</style>
</head>
<body>
  <div class="mnt-fundo" aria-hidden="true"></div>
  <main class="mnt-card">
    <div class="mnt-logo" aria-hidden="true"><span>MW</span></div>
    <h1>estamos atualizando o workspace</h1>
    <p>estamos preparando uma nova versão, com melhorias em várias partes do produto. voltamos em breve. obrigado pela paciência.</p>
    <div class="mnt-linha"><span class="mnt-ponto" aria-hidden="true"></span>em atualização</div>
    <div class="mnt-marca">mateus workspace</div>
  </main>
</body>
</html>
